# Settings shared by the sysinfo scripts (the build appends VOLID).
REPORT=/tmp/sysinfo.txt
# Lock, log and status live in /run, so tidying or filling up /tmp (where
# reports go) cannot remove them or stop them from being written.
LOCK=/run/sysinfo.lock
LOG=/run/sysinfo.log
# "<latest run outcome> <installed report quality> <partial>", e.g.
# "failed incomplete yes"; partial = yes when $REPORT.failed holds the latest
# run's output (an older one may linger if it could not be removed).
STATUS=/run/sysinfo.status
